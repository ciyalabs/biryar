name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # The tenant boundary is PostgreSQL behaviour, so it is tested against
    # PostgreSQL. There is no in-memory substitute that can express row-level
    # security, and a suite that skipped these tests would report green while
    # proving nothing about the one property that matters most.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biryar
          POSTGRES_PASSWORD: biryar
          POSTGRES_DB: biryar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biryar -d biryar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BIRYAR_TEST_DATABASE_URL: postgresql+psycopg://biryar:biryar@localhost:5432/biryar
      BIRYAR_SECRET_KEY: test-key-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A virtualenv rather than --system: the runner's interpreter is
      # Debian's, which refuses to be installed into.
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      # The front end's types are generated from the API's own document, so
      # this regenerates it and fails if it differs from what is committed.
      # Without the check the two drift silently: the API changes shape, the
      # committed types keep describing the old one, and the front end's
      # type check passes while the running pages are wrong.
      - name: The committed OpenAPI document matches the API
        run: |
          uv run python scripts/openapi.py web/openapi.json
          git diff --exit-code web/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc runs as part of build, so this covers the type check too.
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built but not pushed. The point is to find out that it still builds
      # — a Dockerfile nothing exercises is a Dockerfile that stopped
      # working at some commit nobody can name.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: biryar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Before trying to serve: prove the image contains what it should.
      # An exited container with empty logs says the command never ran, and
      # that is not something a second attempt at `docker run` tells you.
      - name: The image contains a working installation
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh biryar:ci -c '
            set -e
            echo "PATH=$PATH"
            echo "--- /opt/venv/bin ---"
            ls /opt/venv/bin | head -20
            echo "--- resolving ---"
            command -v python || echo "no python on PATH"
            command -v uvicorn || echo "no uvicorn on PATH"
            echo "--- importing ---"
            python -c "import biryar, uvicorn; print(biryar.__version__, uvicorn.__version__)"
            echo "--- the app builds ---"
            BIRYAR_DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x \
              python -c "from biryar.api.app import create_app; create_app(); print(\"ok\")"

            # The install guide tells a stranger to run these three inside
            # this image. A module that is not packaged fails here rather
            # than on their first evening.
            echo "--- the documented commands exist ---"
            alembic --help > /dev/null && echo "alembic ok"
            python -m biryar.init --help > /dev/null && echo "biryar.init ok"
            python -m biryar.worker --help > /dev/null && echo "biryar.worker ok"
          '

      - name: The image runs and serves
        run: |
          set -euo pipefail

          docker run -d --name biryar-ci -p 8000:8000 \
            -e BIRYAR_DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x \
            -e BIRYAR_SECRET_KEY="v1:$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            biryar:ci

          report() {
            echo "--- state ---"
            docker inspect -f 'exit={{.State.ExitCode}} error={{.State.Error}} oom={{.State.OOMKilled}}' biryar-ci || true
            echo "--- logs ---"
            docker logs biryar-ci 2>&1 | tail -40 || true
            docker rm -f biryar-ci >/dev/null 2>&1 || true
          }
          trap report EXIT

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health >/dev/null 2>&1; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' biryar-ci)" != "true" ]; then
              echo "the container exited before it served anything"
              exit 1
            fi
            sleep 1
          done

          # The database is deliberately unreachable, so health must report
          # degraded rather than ok — the answer that proves it looked.
          curl -fsS http://127.0.0.1:8000/v1/health | tee /dev/stderr \
            | grep -q '"database":"unreachable"'

          # And the front end is actually inside the image.
          curl -fsS http://127.0.0.1:8000/ | grep -qi "biryar"
