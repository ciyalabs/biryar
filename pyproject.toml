[project]
name = "biryar"
version = "0.1.0.dev0"
description = "A multi-tenant Amazon operations platform"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "sqlalchemy>=2.0.40",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    # Pinned exactly, not floated. A new ruff release adds rules, so a
    # floating pin means CI can fail on a commit that changed nothing.
    "ruff==0.17.3",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biryar"]
# PEP 561. Without it a consumer — including mypy running against the
# installed package rather than the source tree — treats biryar as untyped,
# which is how the same code checked clean locally and failed in CI.
artifacts = ["src/biryar/py.typed"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: needs a live PostgreSQL server (BIRYAR_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Stated rather than detected. Ruff infers first-party from the layout, and
# the inference differs between a source checkout and an installed package,
# so the same file sorted one way locally and another way in CI.
known-first-party = ["biryar"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Name the package rather than a directory to walk, and say where its base
# is. Invoked as a path, mypy derives module names from the filesystem and
# got them wrong whenever the package was also installed, so the same code
# checked eighteen files here and fifteen in CI — the three it could not
# resolve were simply skipped, silently. Run `mypy` with no arguments.
packages = ["biryar"]
mypy_path = "src"
explicit_package_bases = true
